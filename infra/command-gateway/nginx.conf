worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    access_log off;
    lua_package_path '/etc/swarm/?.lua;;';
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8065;
        client_max_body_size 0;  # Mattermost enforces its configured upload limits.
        proxy_http_version 1.1;
        set $mattermost_host mattermost:8065;
        include /etc/swarm/proxy-headers.conf;
        proxy_read_timeout 3600s;
        location = /api/v4/commands/execute {
            access_by_lua_block { require('policy').access() }
            proxy_pass http://$mattermost_host;
        }
        location ~ ^/api/v4/(commands|teams/[^/]+/commands/(autocomplete|autocomplete_suggestions))$ {
            include /etc/swarm/proxy-headers.conf;
            proxy_set_header Accept-Encoding '';
            header_filter_by_lua_block { require('policy').header() }
            body_filter_by_lua_block { require('policy').body() }
            proxy_pass http://$mattermost_host;
        }
        location / { proxy_pass http://$mattermost_host; }
    }
}
