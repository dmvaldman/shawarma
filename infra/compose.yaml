name: agent-company
services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: mattermost
      POSTGRES_DB: mattermost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      HARNESS_DB_PASSWORD: ${HARNESS_DB_PASSWORD:?Set HARNESS_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/10-harness.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mattermost -d mattermost"]
      interval: 5s
      timeout: 5s
      retries: 20
  mattermost:
    platform: linux/amd64
    image: ${MATTERMOST_IMAGE:-mattermost/mattermost-team-edition:10.11.0}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mattermost:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: ${MATTERMOST_SITE_URL:-http://localhost:8065}
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_SERVICESETTINGS_ENABLECOMMANDS: "true"
      MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: ${MATTERMOST_ALLOWED_INTERNAL_CONNECTIONS:-host.docker.internal}
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_TEAMSETTINGS_MAXUSERSPERTEAM: "200"
    volumes:
      - mattermost-data:/mattermost/data
      - mattermost-config:/mattermost/config
      - mattermost-logs:/mattermost/logs
      - mattermost-plugins:/mattermost/plugins
      - mattermost-client-plugins:/mattermost/client/plugins
    healthcheck:
      test: ["CMD", "/mattermost/bin/mmctl", "--local", "system", "status"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  command-gateway:
    image: openresty/openresty:1.27.1.2-0-alpine
    depends_on:
      mattermost:
        condition: service_healthy
    ports:
      - "127.0.0.1:8065:8065"
    volumes:
      - ./command-gateway/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./command-gateway:/etc/swarm:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8065/api/v4/system/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
  mattermost-data:
  mattermost-config:
  mattermost-logs:
  mattermost-plugins:
  mattermost-client-plugins:
