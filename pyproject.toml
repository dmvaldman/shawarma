[project]
name = "agent-company-harness"
version = "0.0.1"
description = "Local agent-native runtime with Mattermost communication"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "websockets>=15,<16",
    "asyncpg>=0.30,<1",
    "jsonschema>=4.23,<5",
    "aiohttp>=3.12,<4",
    "pypdf>=6,<7",
    "cryptography>=46,<50",
    "pyjwt[crypto]>=2.10,<3",
]

[project.scripts]
agent-company = "harness.cli.main:main"
agent-company-coding = "harness.coding.setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.hatch.build.targets.wheel.force-include]
"web/typography.css" = "harness/api/typography.css"
"prompts/common_agent.md" = "harness/prompts/common_agent.md"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "pyyaml>=6,<7",
    "types-jsonschema>=4.26.0.20261006",
    "asyncpg-stubs>=0.32.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
packages = ["harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires the explicitly configured live Mattermost stack"]
